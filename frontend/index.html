<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before CSS/React load, avoiding a light flash.
      (() => {
        let saved
        try { saved = localStorage.getItem('cardioguard.theme') } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#100F14' : '#F8FAFC'
      })()
    </script>
    <meta name="description" content="A local-first, educational workspace for exploring heart signals, machine learning, anatomy, and algorithms." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CARDIOGUARD AI · Overview</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
